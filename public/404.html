<!doctype html>
<meta charset="utf-8">
<title>Grading predictor</title>
<script>
  // GitHub Pages serves this for any unknown path. The app uses hash routes
  // (/#/copies/123), so send a path link (/copies/123) to its hash form.
  var l = window.location;
  l.replace(l.origin + "/#" + l.pathname + l.search);
</script>
