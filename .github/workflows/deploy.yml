name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Builds the site and pushes it to the gh-pages branch; Pages serves that
# branch (Settings → Pages → Deploy from a branch: gh-pages, /). Switched from
# actions/deploy-pages on 2026-11-05 after its publish step hung four times.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_GCS_PUBLIC_BASE: ${{ vars.VITE_GCS_PUBLIC_BASE }}
      - name: Push the build to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
